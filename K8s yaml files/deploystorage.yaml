apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-app
spec:
 replicas: 1
 selector:
  matchLabels:
    app: busybox
 template:
    metadata:
      labels:
        app: busybox
    spec:
     volumes:
     - name: my-volume
       persistentVolumeClaim:
        claimName: helpdesk-logs-pvc
     containers:
      - name: busybox
        image: busybox      
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
        volumeMounts:
        - name: my-volume
          mountPath: "/helpdesk"