apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend-rs
spec: # this spec refers specification of my rs
 replicas: 2
 selector:
  matchLabels:
     app: frontend-siva
  # pod template
 template: 
  metadata:
    labels:
      app: frontend-siva
  spec: # this spec refers specification of my pod
    containers:
    - image: nginx
      name: my-container   